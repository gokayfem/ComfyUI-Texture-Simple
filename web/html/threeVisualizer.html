<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=1"
        >
        <title>Texture Viewer</title>
        <link rel="stylesheet" href="../style/threeStyle.css">
        <script type="importmap">
            {
                "imports": {
                    "three": "../vendor/three.module.min.mjs"
                }
            }
        </script>
    </head>
    <body>
        <main id="viewer" aria-label="Interactive material preview">
            <div id="canvas-container"></div>
            <div id="status" role="status" aria-live="polite">Queue texture maps to preview them.</div>
            <div id="error" role="alert" hidden></div>

            <section id="material-panel" hidden aria-label="Material controls">
                <div class="panel-heading">
                    <strong>Material</strong>
                    <button id="close-material" type="button" aria-label="Hide material controls">×</button>
                </div>
                <label>Roughness <input id="roughness" type="range" min="0" max="1" step="0.01" value="0.65"></label>
                <label>Metalness <input id="metalness" type="range" min="0" max="1" step="0.01" value="0"></label>
                <label>Displacement <input id="displacement" type="range" min="-2" max="2" step="0.005" value="0.025"></label>
                <label>Normal strength <input id="normal-strength" type="range" min="0" max="3" step="0.05" value="0.7"></label>
                <label>AO strength <input id="ao-strength" type="range" min="0" max="3" step="0.05" value="1"></label>
                <label>Repeat X <input id="repeat-x" type="number" min="0.1" max="20" step="0.1" value="1"></label>
                <label>Repeat Y <input id="repeat-y" type="number" min="0.1" max="20" step="0.1" value="1"></label>
                <label>
                    View
                    <select id="view-mode">
                        <option value="material">PBR material</option>
                        <option value="color">Color map</option>
                        <option value="normal">Normal map</option>
                        <option value="roughness">Roughness map</option>
                        <option value="metalness">Metalness map</option>
                        <option value="ao">AO map</option>
                        <option value="displacement">Displacement map</option>
                    </select>
                </label>
                <label>
                    Tone mapping
                    <select id="tone-mapping">
                        <option value="aces">ACES filmic</option>
                        <option value="neutral">Neutral</option>
                        <option value="linear">Linear</option>
                        <option value="none">None</option>
                    </select>
                </label>
                <label>Exposure <input id="exposure" type="range" min="0.1" max="3" step="0.05" value="1"></label>
                <label>Background <input id="background" type="color" value="#252a31"></label>
                <label class="checkbox"><input id="wireframe" type="checkbox"> Wireframe overlay</label>
                <label class="checkbox"><input id="auto-rotate" type="checkbox"> Auto rotate</label>
            </section>

            <section class="toolbar" aria-label="Texture viewer controls">
                <label>
                    Frame
                    <select id="batch-select" disabled></select>
                </label>
                <label>
                    Mesh
                    <select id="mesh-select">
                        <option value="sphere">Sphere</option>
                        <option value="cube">Cube</option>
                        <option value="torus">Torus</option>
                        <option value="plane">Plane</option>
                        <option value="showcase">Showcase</option>
                    </select>
                </label>
                <input id="mesh-file" type="file" accept=".glb,.obj" hidden>
                <button id="load-mesh" type="button">Load GLB/OBJ</button>
                <button id="toggle-material" type="button">Material</button>
                <button id="reset-camera" type="button">Reset</button>
                <button id="screenshot" type="button">PNG</button>
                <label>
                    Export
                    <select id="export-format">
                        <option value="glb">GLB</option>
                        <option value="gltf">GLTF</option>
                        <option value="obj">OBJ</option>
                    </select>
                </label>
                <button id="export-mesh" type="button">Save</button>
            </section>
        </main>

        <script type="module" src="../js/threeVisualizer.mjs?v=3.0.0"></script>
    </body>
</html>
